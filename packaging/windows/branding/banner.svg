<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="833" height="137" viewBox="0 0 833 137">
  <!-- The Windows installer's banner (top of every GridLogic Setup dialog, 370 x 56 dialog units,
       drawn at 1.5x). Aegean Logic palette: ink #0A2A3B into sea #12718C, marble #F4F2EC text, one
       aqua #2FC6C0 accent. The logo is the brand kit's reversed lockup, referenced, not copied.
       generate.ps1 renders this to banner.bmp. -->
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A2A3B"/>
      <stop offset="0.55" stop-color="#0E4A62"/>
      <stop offset="1" stop-color="#12718C"/>
    </linearGradient>
  </defs>
  <rect width="833" height="137" fill="url(#sea)"/>
  <image x="26" y="20" width="236" height="97" xlink:href="../../../docs/brand/aegean-logic-lockup-dark.svg" preserveAspectRatio="xMinYMid meet"/>
  <text x="805" y="76" text-anchor="end" font-family="Segoe UI Semibold, Segoe UI, sans-serif" font-weight="600" font-size="38" fill="#F4F2EC">GridLogic</text>
  <text x="805" y="104" text-anchor="end" font-family="Segoe UI, sans-serif" font-size="19" fill="#2FC6C0">Setup</text>
  <rect y="133" width="833" height="4" fill="#2FC6C0"/>
</svg>
